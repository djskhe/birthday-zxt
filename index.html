<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf4ff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%82%3C/text%3E%3C/svg%3E">
<meta name="description" content="写给曾祥婷的十八岁生日贺卡">
<title>曾祥婷 · 十八岁生日快乐</title>
<meta property="og:title" content="曾祥婷 · 十八岁生日快乐">
<meta property="og:description" content="一份迟到几天的生日礼物，点开拆一下。">
<meta property="og:type" content="website">
<style>
  :root{
    --violet:#5b46a8;
    --violet-deep:#3d2f6b;
    --pink:#ff9ec4;
    --pink-soft:#ffd3e4;
    --blue:#7fc4ef;
    --ink:#4a3b78;
    --ink-soft:#7d6fa8;
    --ease:cubic-bezier(.22,.9,.24,1);
    --pad-t:max(22px,env(safe-area-inset-top));
    --pad-b:max(20px,env(safe-area-inset-bottom));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;height:100dvh;overflow:hidden;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:linear-gradient(178deg,#eaf6ff 0%,#f0efff 34%,#fbefff 62%,#fff0f6 100%);
  }

  /* ---------- 背景 ---------- */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .aurora{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
  .a1{width:70vw;height:70vw;left:-22vw;top:-26vw;background:radial-gradient(circle,#a9dcff,transparent 68%);animation:drift1 18s ease-in-out infinite alternate}
  .a2{width:64vw;height:64vw;right:-20vw;top:-8vw;background:radial-gradient(circle,#ffc2dd,transparent 68%);animation:drift2 21s ease-in-out infinite alternate}
  .a3{width:86vw;height:70vw;left:8vw;bottom:-34vw;background:radial-gradient(circle,#cdbcff,transparent 70%);animation:drift1 24s ease-in-out infinite alternate-reverse}
  @keyframes drift1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(4vw,3vh,0) scale(1.08)}}
  @keyframes drift2{from{transform:translate3d(0,0,0) scale(1.05)}to{transform:translate3d(-5vw,4vh,0) scale(.96)}}

  .bokeh{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);opacity:.7}
  .b1{width:120px;height:120px;left:5%;top:56%;animation:floaty 12s ease-in-out infinite}
  .b2{width:74px;height:74px;right:8%;top:20%;animation:floaty 9s ease-in-out infinite .8s}
  .b3{width:46px;height:46px;left:20%;top:14%;animation:floaty 11s ease-in-out infinite .4s}
  .b4{width:90px;height:90px;right:14%;bottom:14%;animation:floaty 14s ease-in-out infinite .2s}
  @keyframes floaty{0%,100%{transform:translateY(0) scale(1);opacity:.5}50%{transform:translateY(-16px) scale(1.08);opacity:.85}}

  .stars{position:absolute;inset:0;opacity:.8;
    background-image:
      radial-gradient(circle,#fff 0 1.1px,transparent 1.8px),
      radial-gradient(circle,rgba(255,255,255,.75) 0 .9px,transparent 1.5px),
      radial-gradient(circle,rgba(122,107,166,.3) 0 1px,transparent 1.6px);
    background-size:180px 180px,260px 260px,320px 320px;
    background-position:0 0,74px 118px,150px 46px;
    animation:twinkle 8s ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.42}to{opacity:.9}}

  canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:block}
  #fx{z-index:1}
  #fxTop{z-index:9}

  /* ---------- 页面层 ---------- */
  .stage{position:relative;z-index:2;height:100dvh}
  .layer{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:var(--pad-t) 20px var(--pad-b);
    overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    visibility:hidden;opacity:0;
    transition:opacity .75s var(--ease), visibility 0s linear .75s;
  }
  .layer.is-visible{visibility:visible;opacity:1;transition:opacity .75s var(--ease), visibility 0s linear 0s}
  .layer > .inner{margin:auto;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
  #intro{z-index:4}
  #finale{z-index:3}

  /* ---------- 首屏 ---------- */
  .eyebrow{margin:0 0 12px;font-size:12px;letter-spacing:.44em;text-indent:.44em;color:var(--ink-soft)}
  h1{margin:0;font-size:clamp(28px,8.4vw,40px);line-height:1.26;font-weight:800;letter-spacing:.02em;
    color:var(--violet-deep);
    text-shadow:0 2px 0 rgba(255,255,255,.9), 0 16px 34px rgba(96,72,168,.16)}
  h1 .name{color:var(--violet)}
  .sub{margin:12px 0 0;font-size:13px;letter-spacing:.16em;color:var(--ink-soft)}
  .sub b{color:var(--pink);font-weight:700}

  .giftwrap{position:relative;width:min(60vw,214px);aspect-ratio:1/1;margin:clamp(12px,3vh,26px) 0 0}
  .halo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(78vw,290px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.96) 0%,rgba(255,214,232,.55) 42%,rgba(255,214,232,0) 70%);
    animation:breathe 4.4s ease-in-out infinite;pointer-events:none}
  @keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(.93);opacity:.7}50%{transform:translate(-50%,-50%) scale(1.07);opacity:1}}

  .box{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;display:block;cursor:pointer;
    filter:drop-shadow(0 20px 28px rgba(96,72,168,.24));transform-origin:50% 100%;
    animation:boxBob 3.6s ease-in-out infinite}
  @keyframes boxBob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-7px) rotate(.6deg)}}
  .box.is-shake{animation:boxShake .6s ease-in-out}
  @keyframes boxShake{0%,100%{transform:translateX(0) rotate(0)}18%{transform:translateX(-6px) rotate(-2.4deg)}36%{transform:translateX(6px) rotate(2.4deg)}54%{transform:translateX(-4px) rotate(-1.4deg)}72%{transform:translateX(2px) rotate(.8deg)}}
  .lid{transform-box:fill-box;transform-origin:50% 92%}
  .box.is-open .lid{animation:lidFly .95s var(--ease) forwards}
  @keyframes lidFly{0%{transform:translateY(0) rotate(0);opacity:1}42%{transform:translateY(-54px) rotate(-14deg);opacity:1}100%{transform:translateY(-106px) rotate(-32deg);opacity:0}}
  .box.is-open .box-body{animation:boxFade .9s var(--ease) .18s forwards}
  @keyframes boxFade{to{opacity:0}}

  .tip{position:absolute;top:-4px;right:-4px;padding:6px 11px;border-radius:14px 14px 14px 4px;
    background:rgba(255,255,255,.95);font-size:11.5px;color:var(--violet);letter-spacing:.06em;
    box-shadow:0 8px 18px rgba(96,72,168,.16);animation:tipFloat 3.2s ease-in-out infinite}
  @keyframes tipFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  /* ---------- 蛋小黑 ---------- */
  .egg-pos{position:absolute;left:0;right:0;bottom:28%;display:flex;justify-content:center;pointer-events:none}
  .egg{width:min(33vw,116px);height:auto;display:block;opacity:0;transform:scale(.5) translateY(38px);transform-origin:50% 100%;
    filter:drop-shadow(0 12px 18px rgba(63,48,112,.3));pointer-events:auto;cursor:pointer}
  .egg.is-pop{animation:eggPop 1.05s var(--ease) forwards}
  @keyframes eggPop{
    0%{opacity:0;transform:scale(.5) translateY(46px) rotate(-9deg)}
    24%{opacity:1;transform:scale(1.12) translateY(-32px) rotate(8deg)}
    44%{transform:scale(.95) translateY(-54px) rotate(-4deg)}
    62%{transform:scale(1.04) translateY(-42px) rotate(2deg)}
    100%{opacity:1;transform:scale(1) translateY(-46px) rotate(0)}
  }
  .egg__bob{transform-origin:50% 92%;display:block;width:100%;height:auto}
  .egg.is-pop .egg__bob{animation:bob 3.2s ease-in-out 1.05s infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1.4deg)}50%{transform:translateY(-8px) rotate(1.4deg)}}
  .egg__eyes{transform-box:fill-box;transform-origin:50%;animation:blink 5.4s ease-in-out infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
  .egg__arm{transform-box:fill-box;transform-origin:50% 8%;animation:wave 3.6s ease-in-out infinite}
  @keyframes wave{0%,56%,100%{transform:rotate(0)}66%{transform:rotate(-24deg)}76%{transform:rotate(8deg)}86%{transform:rotate(-15deg)}}

  /* ---------- 按钮 ---------- */
  .btn-wrap{margin-top:clamp(12px,3vh,24px)}
  .gift-btn{position:relative;border:0;cursor:pointer;font-family:inherit;
    padding:16px 38px;border-radius:999px;font-size:16px;font-weight:700;letter-spacing:.14em;text-indent:.14em;color:#fff;
    background:linear-gradient(135deg,#8fcbf2 0%,#a58ce8 46%,#ff9ec4 100%);
    box-shadow:0 14px 30px rgba(111,87,196,.34), inset 0 1px 0 rgba(255,255,255,.6);
    transition:transform .22s var(--ease);overflow:hidden}
  .gift-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.55) 46%,transparent 62%);
    transform:translateX(-120%);animation:sheen 3.6s ease-in-out infinite}
  @keyframes sheen{0%,55%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}
  .gift-btn:active{transform:translateY(2px) scale(.98)}
  .gift-btn::after{content:"";position:absolute;inset:-6px;border-radius:999px;border:1.5px solid rgba(165,140,232,.4);animation:ring 2.4s ease-out infinite;pointer-events:none}
  @keyframes ring{0%{transform:scale(.94);opacity:.9}70%{transform:scale(1.12);opacity:0}100%{opacity:0}}
  .hint{margin:13px 0 0;font-size:12px;letter-spacing:.16em;color:var(--ink-soft);opacity:.85}

  /* ---------- 祝福卡 ---------- */
  .bunting{width:min(96vw,440px);height:auto;display:block;margin:0 auto -6px;opacity:.95}
  .pennant{transform-box:fill-box;transform-origin:50% 0;animation:sway 4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}

  .finale-inner{padding-top:2px}
  .peek{width:min(27vw,94px);margin:-6px auto -12px;filter:drop-shadow(0 10px 16px rgba(63,48,112,.26));
    animation:bob 3.4s ease-in-out infinite .2s;position:relative;z-index:3}
  .peek svg{display:block;width:100%;height:auto}

  .card{position:relative;width:min(92vw,410px);margin:0 auto;
    padding:clamp(20px,4.6vw,28px) clamp(18px,4.6vw,26px) 14px;border-radius:26px;text-align:center;
    background:linear-gradient(168deg,rgba(255,255,255,.97),rgba(255,247,251,.94));
    box-shadow:0 24px 50px rgba(96,72,168,.18), 0 0 0 1px rgba(255,255,255,.85) inset}
  .card::before{content:"";position:absolute;inset:8px;border-radius:20px;border:1px solid rgba(255,180,210,.45);pointer-events:none}
  .tape{position:absolute;width:64px;height:20px;background:linear-gradient(100deg,rgba(255,214,232,.92),rgba(214,198,255,.85));opacity:.85}
  .tape.l{left:-16px;top:26px;transform:rotate(-32deg)}
  .tape.r{right:-16px;bottom:34px;transform:rotate(-32deg)}
  .card__tag{margin:0 0 10px;font-size:11px;letter-spacing:.44em;text-indent:.44em;color:var(--pink);font-weight:700}
  .card__title{margin:0 0 12px;font-size:clamp(20px,5.6vw,24px);font-weight:800;letter-spacing:.04em;
    background:linear-gradient(100deg,#6a56c0,#c86fa8 58%,#e78fb8);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .card__line{margin:0 0 9px;font-size:clamp(13.5px,3.9vw,15px);line-height:1.9;color:var(--ink)}
  .card__line em{font-style:normal;color:var(--violet);font-weight:700}
  .card__sign{margin:14px 0 0;font-size:12.5px;letter-spacing:.1em;color:var(--ink-soft)}
  .card-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed rgba(122,107,166,.24);flex-wrap:wrap}
  .mini{border:0;background:transparent;cursor:pointer;font-family:inherit;font-size:12.5px;letter-spacing:.08em;color:var(--ink-soft);padding:7px 8px;border-radius:999px;transition:color .2s,background .2s}
  .mini:hover{color:var(--violet);background:rgba(165,140,232,.1)}
  .mini:active{transform:scale(.96)}
  .dot{width:3px;height:3px;border-radius:50%;background:rgba(122,107,166,.45)}

  /* ---------- 蛋糕 ---------- */
  .cake-wrap{width:min(86vw,320px);margin:10px auto 0;position:relative}
  #cake{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 18px 26px rgba(96,72,168,.16))}
  .candle{cursor:pointer}
  .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 1.5s ease-in-out infinite}
  @keyframes flicker{0%,100%{transform:scale(1) translateY(0) rotate(-1deg);opacity:.95}35%{transform:scale(1.08,.94) translateY(-1px) rotate(2deg);opacity:1}70%{transform:scale(.94,1.06) translateY(1px) rotate(-2deg);opacity:.9}}
  .candle.is-out .flame{animation:none;opacity:0;transform:scale(.1);transition:opacity .3s ease,transform .3s ease}
  .smoke{opacity:0;transition:opacity .3s ease}
  .candle.is-out .smoke{opacity:.5}
  .candle.is-out .smoke path{animation:smokeRise 2.2s ease-out infinite}
  @keyframes smokeRise{0%{transform:translateY(0) scale(.7);opacity:.7}100%{transform:translateY(-24px) scale(1.5);opacity:0}}
  .cake-hint{margin:4px 0 0;font-size:12px;letter-spacing:.14em;color:var(--ink-soft);min-height:18px}
  .blow-btn{margin-top:10px;border:0;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.12em;
    padding:12px 26px;border-radius:999px;color:#fff;background:linear-gradient(135deg,#f7a7c8,#c79bf0);
    box-shadow:0 10px 22px rgba(199,155,240,.36);transition:transform .2s var(--ease),opacity .3s ease}
  .blow-btn:active{transform:scale(.97)}
  .blow-btn.is-done{opacity:.45;pointer-events:none}
  .wish{margin:10px 0 0;font-size:13px;letter-spacing:.12em;line-height:1.8;color:var(--violet);
    opacity:0;transform:translateY(8px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
  .wish.is-in{opacity:1;transform:none}

  .down-hint{position:fixed;left:50%;bottom:calc(var(--pad-b) + 10px);transform:translateX(-50%);
    z-index:5;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.85);
    font-size:12px;color:var(--ink-soft);box-shadow:0 6px 16px rgba(96,72,168,.14);
    animation:tipFloat 2.6s ease-in-out infinite;pointer-events:none;opacity:0;transition:opacity .4s ease}
  .down-hint.is-in{opacity:1}

  @media (prefers-reduced-motion:reduce){
    .aurora,.bokeh,.stars,.box,.halo,.egg__eyes,.egg__arm,.egg.is-pop .egg__bob,.peek,.gift-btn::before,.gift-btn::after,.flame,.tip,.bunting,.pennant,.down-hint{animation:none!important}
    .layer{transition-duration:.01s}
    .candle.is-out .smoke path{animation:none}
  }
  @media (max-height:720px){
    .hint{display:none}
    .giftwrap{width:min(50vw,176px)}
    .sub{margin-top:8px}
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div>
  <div class="bokeh b1"></div><div class="bokeh b2"></div><div class="bokeh b3"></div><div class="bokeh b4"></div>
  <div class="stars"></div>
</div>
<canvas class="fx" id="fx" aria-hidden="true"></canvas>
<canvas class="fx" id="fxTop" aria-hidden="true"></canvas>

<template id="eggTpl">
  <svg viewBox="0 0 200 236" role="img" aria-label="蛋小黑">
    <g class="egg__bob">
      <defs>
        <radialGradient id="eggBody" cx="36%" cy="24%" r="84%">
          <stop offset="0" stop-color="#7a7a96"/><stop offset="38%" stop-color="#3d3d56"/><stop offset="100%" stop-color="#1b1b28"/>
        </radialGradient>
        <linearGradient id="hatG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffd7e7"/><stop offset="1" stop-color="#ff9ec4"/>
        </linearGradient>
        <radialGradient id="eggShine" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <ellipse cx="100" cy="222" rx="46" ry="8" fill="#5b46a8" opacity=".14"/>
      <ellipse cx="74" cy="210" rx="15" ry="9" fill="#242433"/>
      <ellipse cx="126" cy="210" rx="15" ry="9" fill="#242433"/>

      <path d="M100 30c46 0 74 64 74 112 0 40-32 66-74 66s-74-26-74-66C26 94 54 30 100 30Z" fill="url(#eggBody)"/>
      <ellipse cx="72" cy="76" rx="26" ry="19" fill="url(#eggShine)" transform="rotate(-18 72 76)"/>

      <path d="M28 138c-14 4-20 14-16 22 4 8 16 8 24-2" fill="none" stroke="#242433" stroke-width="11" stroke-linecap="round"/>
      <path class="egg__arm" d="M172 134c14 2 22 12 19 21-3 9-15 10-24 1" fill="none" stroke="#242433" stroke-width="11" stroke-linecap="round"/>

      <g class="egg__eyes">
        <ellipse cx="76" cy="138" rx="13" ry="15" fill="#ffffff"/>
        <ellipse cx="124" cy="138" rx="13" ry="15" fill="#ffffff"/>
        <ellipse cx="78" cy="140" rx="7.8" ry="9.2" fill="#1e1e2c"/>
        <ellipse cx="126" cy="140" rx="7.8" ry="9.2" fill="#1e1e2c"/>
        <circle cx="81.5" cy="136" r="2.8" fill="#ffffff"/>
        <circle cx="129.5" cy="136" r="2.8" fill="#ffffff"/>
        <circle cx="75" cy="145" r="1.6" fill="#ffffff" opacity=".85"/>
        <circle cx="123" cy="145" r="1.6" fill="#ffffff" opacity=".85"/>
      </g>

      <ellipse cx="54" cy="162" rx="11.5" ry="7" fill="#ff9ec4" opacity=".6"/>
      <ellipse cx="146" cy="162" rx="11.5" ry="7" fill="#ff9ec4" opacity=".6"/>
      <path d="M92 163c3.8 6.4 12.4 6.4 16 0" fill="none" stroke="#14141f" stroke-width="3.4" stroke-linecap="round"/>

      <g transform="translate(126 36) rotate(15)">
        <path d="M0 0 16-46 32 0Z" fill="url(#hatG)"/>
        <circle cx="16" cy="-48" r="6.6" fill="#fff6fb"/>
        <path d="M4.5-14h23" stroke="#ffffff" stroke-opacity=".75" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
  </svg>
</template>

<div class="stage">
  <section class="layer" id="intro" aria-label="生日礼物">
    <div class="inner">
      <p class="eyebrow">迟 到 的 生 日 贺 卡</p>
      <h1><span class="name">曾祥婷</span>，十八岁快乐</h1>
      <p class="sub">补上的这一份，<b>不算晚</b></p>

      <div class="giftwrap" id="giftwrap">
        <div class="halo" aria-hidden="true"></div>
        <div class="tip">里面有只小黑蛋</div>
        <div class="egg-pos" id="eggSlot"></div>

        <svg class="box" id="box" viewBox="0 0 240 210" role="img" aria-label="礼物盒">
          <defs>
            <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#b4dcf7"/><stop offset="1" stop-color="#83b7e9"/>
            </linearGradient>
            <linearGradient id="lidG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffe0ec"/><stop offset="1" stop-color="#ffa9cc"/>
            </linearGradient>
            <linearGradient id="ribbonG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffbcd8"/><stop offset="1" stop-color="#ff85b6"/>
            </linearGradient>
            <radialGradient id="glowIn" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#fff3fa" stop-opacity=".95"/><stop offset="100%" stop-color="#ffe0ef" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <ellipse cx="120" cy="120" rx="66" ry="42" fill="url(#glowIn)" opacity=".75"/>

          <g class="box-body">
            <rect x="30" y="96" width="180" height="92" rx="14" fill="url(#boxFront)"/>
            <rect x="30" y="96" width="180" height="92" rx="14" fill="none" stroke="#fff" stroke-opacity=".55"/>
            <path d="M30 118h180" stroke="#fff" stroke-opacity=".32" stroke-width="2"/>
            <rect x="106" y="96" width="28" height="92" fill="url(#ribbonG)"/>
            <path d="M44 186h152" stroke="#5b46a8" stroke-opacity=".12" stroke-width="3"/>
          </g>

          <g class="lid">
            <rect x="16" y="60" width="208" height="42" rx="13" fill="url(#lidG)"/>
            <rect x="16" y="60" width="208" height="42" rx="13" fill="none" stroke="#fff" stroke-opacity=".6"/>
            <rect x="106" y="60" width="28" height="42" fill="url(#ribbonG)"/>

    ];
    rows.forEach(function (row, ri) {
      for (var i = 0; i < row.n; i++) {
        var t = i / (row.n - 1);
        var x = 160 - row.rx + t * row.rx * 2;
        var y = row.y - Math.sin(t * Math.PI) * row.arch;
        var hh = row.h + ((i + ri) % 2 ? 2 : -2);
        var g = document.createElementNS(NS, "g");
        g.setAttribute("class", "candle");
        var tip = y - hh;
        g.innerHTML =
          '<rect x="' + (x - 3).toFixed(1) + '" y="' + tip.toFixed(1) + '" width="6" height="' + hh + '" rx="3" fill="url(#candleG)"/>' +
          '<path d="M' + (x - 3).toFixed(1) + ' ' + (tip + 7).toFixed(1) + 'h6 M' + (x - 3).toFixed(1) + ' ' + (tip + 16).toFixed(1) + 'h6" stroke="#ff9ec4" stroke-width="2" stroke-linecap="round" opacity=".55"/>' +
          '<line x1="' + x.toFixed(1) + '" y1="' + tip.toFixed(1) + '" x2="' + x.toFixed(1) + '" y2="' + (tip - 4).toFixed(1) + '" stroke="#6b5a4a" stroke-width="1.6"/>' +
          '<g class="smoke"><path d="M' + x.toFixed(1) + ' ' + (tip - 8).toFixed(1) + ' q-5 -8 0 -16 q5 -8 0 -16" fill="none" stroke="#cfc7e3" stroke-width="2" stroke-linecap="round"/></g>' +
          '<g class="flame">' +
            '<ellipse cx="' + x.toFixed(1) + '" cy="' + (tip - 15).toFixed(1) + '" rx="10" ry="12" fill="url(#flameGlow)"/>' +
            '<path d="M' + x.toFixed(1) + ' ' + (tip - 26).toFixed(1) + 'c6 5 8 9 8 13 0 6-3.5 9-8 9s-8-3-8-9c0-4 2-8 8-13Z" fill="url(#flameG)"/>' +
          '</g>';
        layer.appendChild(g);
        candleEls.push(g);
      }
    });
  }

  /* ================= 交互 ================= */
  var intro = $("intro"), finale = $("finale"), giftwrap = $("giftwrap"), box = $("box");
  var egg = makeEgg($("eggSlot"), "egg");
  makeEgg($("peek"), "peek-art");
  var blowBtn = $("blowBtn"), wish = $("wish"), cakeHint = $("cakeHint"), downHint = $("downHint");
  var opened = false, busy = false, blown = false;

  function showFinale() {
    finale.classList.add("is-visible");
    intro.classList.remove("is-visible");
    setTimeout(function () {
      burstAt($("peek"), reduce ? 10 : 34);
      busy = false;
      setTimeout(function () {
        if (finale.scrollHeight > finale.clientHeight + 30) {
          downHint.classList.add("is-in");
          setTimeout(function () { downHint.classList.remove("is-in"); }, 4200);
        }
      }, 900);
    }, reduce ? 30 : 480);
  }
  function openGift() {
    if (opened || busy) return;
    opened = true; busy = true;
    box.classList.remove("is-shake");
    void box.offsetWidth;
    box.classList.add("is-shake");
    burstAt(giftwrap, reduce ? 12 : 40);
    startMusic();
    setTimeout(function () {
      box.classList.add("is-open");
      egg.classList.add("is-pop");
      chime();
      burstAt(egg, reduce ? 16 : 64);
      setTimeout(showFinale, reduce ? 60 : 840);
    }, reduce ? 60 : 620);
  }
  function blow() {
    if (blown || !opened) return;
    blown = true;
    whoosh();
    blowBtn.classList.add("is-done");
    candleEls.forEach(function (c, i) {
      setTimeout(function () { c.classList.add("is-out"); }, i * 75);
    });
    setTimeout(function () {
      wish.classList.add("is-in");
      cakeHint.textContent = "十八岁，愿望会实现的";
      var r = $("cake").getBoundingClientRect();
      confetti(r.left + r.width / 2, r.top + r.height * .3, reduce ? 16 : 70);
      setTimeout(function () {
        confetti(r.left + r.width * .22, r.top + r.height * .34, reduce ? 10 : 34);
        confetti(r.left + r.width * .78, r.top + r.height * .32, reduce ? 10 : 34);
      }, 260);
      chime();
    }, 320 + candleEls.length * 75);
  }
  function resetAll() {
    finale.classList.remove("is-visible");
    intro.classList.add("is-visible");
    box.classList.remove("is-open", "is-shake");
    egg.classList.remove("is-pop");
    blown = false;
    blowBtn.classList.remove("is-done");
    wish.classList.remove("is-in");
    cakeHint.textContent = "十八根蜡烛，替她吹一下吧";
    candleEls.forEach(function (c) { c.classList.remove("is-out"); });
    downHint.classList.remove("is-in");
    opened = false; busy = false;
    finale.scrollTop = 0;
  }

  $("giftBtn").addEventListener("click", openGift);
  box.addEventListener("click", function (e) { e.preventDefault(); openGift(); });
  blowBtn.addEventListener("click", blow);
  $("cake").addEventListener("click", blow);

  egg.addEventListener("click", function (e) {
    e.stopPropagation();
    burstAt(egg, reduce ? 8 : 22);
    var bob = egg.querySelector(".egg__bob");
    if (bob) {
      bob.style.transition = "transform .18s ease";
      bob.style.transform = "scale(1.09)";
      setTimeout(function () { bob.style.transform = ""; }, 200);
    }
  });

  $("replay").addEventListener("click", function () {
    if (busy) return;
    busy = true;
    resetAll();
    setTimeout(function () { busy = false; openGift(); }, 420);
  });
  $("soundBtn").addEventListener("click", function () {
    soundOn = !soundOn;
    this.textContent = soundOn ? "音乐：开" : "音乐：关";
    this.setAttribute("aria-pressed", soundOn ? "true" : "false");
    if (soundOn) { startMusic(); chime(); } else { stopMusic(); }
  });

  var rzT = 0;
  window.addEventListener("resize", function () {
    clearTimeout(rzT);
    rzT = setTimeout(function () {
      resize();
      petals.forEach(function (p) {
        if (p.x > W + 60 || p.y > H + 60) { p.x = rand(0, W); p.y = rand(-40, 0); }
      });
    }, 160);
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopLoop(); else startLoop();
  });

  intro.classList.add("is-visible");
  buildBunting();
  buildCandles();
  seed();
  startLoop();
})();
</script>
</body>
</html>
