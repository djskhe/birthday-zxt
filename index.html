<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf4ff">
<meta name="description" content="写给曾祥婷的十八岁生日贺卡">
<title>曾祥婷 · 十八岁生日快乐</title>
<meta property="og:title" content="曾祥婷 · 十八岁生日快乐">
<meta property="og:description" content="一封火漆封口的信，一封迟到了几天的祝福。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --violet:#5b46a8;
    --violet-deep:#3d2f6b;
    --pink:#ff9ec4;
    --ink:#4a3b78;
    --ink-soft:#7d6fa8;
    --ease:cubic-bezier(.22,.9,.24,1);
    --pad-t:max(22px,env(safe-area-inset-top));
    --pad-b:max(20px,env(safe-area-inset-bottom));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;height:100dvh;overflow:hidden;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:linear-gradient(178deg,#eaf6ff 0%,#f0efff 34%,#fbefff 62%,#fff0f6 100%);
  }

  /* ---------- 背景 ---------- */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .aurora{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
  .a1{width:70vw;height:70vw;left:-22vw;top:-26vw;background:radial-gradient(circle,#a9dcff,transparent 68%);animation:drift1 18s ease-in-out infinite alternate}
  .a2{width:64vw;height:64vw;right:-20vw;top:-8vw;background:radial-gradient(circle,#ffc2dd,transparent 68%);animation:drift2 21s ease-in-out infinite alternate}
  .a3{width:86vw;height:70vw;left:8vw;bottom:-34vw;background:radial-gradient(circle,#cdbcff,transparent 70%);animation:drift1 24s ease-in-out infinite alternate-reverse}
  @keyframes drift1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(4vw,3vh,0) scale(1.08)}}
  @keyframes drift2{from{transform:translate3d(0,0,0) scale(1.05)}to{transform:translate3d(-5vw,4vh,0) scale(.96)}}
  .bokeh{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);opacity:.7}
  .b1{width:120px;height:120px;left:5%;top:56%;animation:floaty 12s ease-in-out infinite}
  .b2{width:74px;height:74px;right:8%;top:20%;animation:floaty 9s ease-in-out infinite .8s}
  .b3{width:46px;height:46px;left:20%;top:14%;animation:floaty 11s ease-in-out infinite .4s}
  .b4{width:90px;height:90px;right:14%;bottom:14%;animation:floaty 14s ease-in-out infinite .2s}
  @keyframes floaty{0%,100%{transform:translateY(0) scale(1);opacity:.5}50%{transform:translateY(-16px) scale(1.08);opacity:.85}}
  .stars{position:absolute;inset:0;opacity:.8;
    background-image:
      radial-gradient(circle,#fff 0 1.1px,transparent 1.8px),
      radial-gradient(circle,rgba(255,255,255,.75) 0 .9px,transparent 1.5px),
      radial-gradient(circle,rgba(122,107,166,.3) 0 1px,transparent 1.6px);
    background-size:180px 180px,260px 260px,320px 320px;
    background-position:0 0,74px 118px,150px 46px;
    animation:twinkle 8s ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.42}to{opacity:.9}}

  canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:block}
  #fx{z-index:1}
  #fxTop{z-index:12}

  /* ---------- 舞台 ---------- */
  .stage{position:relative;z-index:2;height:100dvh}
  .layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:var(--pad-t) 20px var(--pad-b);
    overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    visibility:hidden;opacity:0;
    transition:opacity .7s var(--ease), visibility 0s linear .7s}
  .layer.is-visible{visibility:visible;opacity:1;transition:opacity .7s var(--ease), visibility 0s linear 0s}
  .layer > .inner{margin:auto;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
  #cover{z-index:5}
  #letter{z-index:4}
  #cakeScene{z-index:3;background:radial-gradient(120% 80% at 50% 12%,#2e2456 0%,#1d1638 52%,#120d26 100%)}
  #cakeScene::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(60% 40% at 18% 30%,rgba(255,158,196,.22),transparent 70%),
      radial-gradient(50% 36% at 84% 24%,rgba(127,196,239,.20),transparent 70%),
      radial-gradient(70% 40% at 50% 96%,rgba(140,110,255,.22),transparent 70%)}
  #cakeScene .inner{position:relative;z-index:1}

  /* ---------- 首屏 ---------- */
  .eyebrow{margin:0 0 10px;font-size:11px;letter-spacing:.42em;text-indent:.42em;color:var(--ink-soft)}
  h1{margin:0;font-size:clamp(27px,8vw,38px);line-height:1.26;font-weight:800;letter-spacing:.02em;color:var(--violet-deep);
    text-shadow:0 2px 0 rgba(255,255,255,.9), 0 16px 34px rgba(96,72,168,.16)}
  h1 .name{color:var(--violet)}
  .sub{margin:10px 0 0;font-size:12.5px;letter-spacing:.16em;color:var(--ink-soft)}
  .sub b{color:var(--pink);font-weight:700}

  /* ---------- 信封 ---------- */
  .env-wrap{position:relative;width:min(86vw,352px);aspect-ratio:352/238;margin:clamp(14px,3.2vh,26px) auto 0;perspective:1100px}
  .env{position:absolute;inset:0;transform-style:preserve-3d}
  .env__back{position:absolute;inset:0;border-radius:16px;background:linear-gradient(160deg,#fff9fc,#ffe6f2);
    box-shadow:0 26px 48px rgba(96,72,168,.24), inset 0 0 0 1px rgba(255,255,255,.9)}
  .env__letter{position:absolute;left:7%;right:7%;top:11%;bottom:14%;border-radius:8px;z-index:2;
    background:linear-gradient(180deg,#fffefd,#fff7fb);box-shadow:0 10px 22px rgba(96,72,168,.16);
    transform:translateY(12%);transition:transform .9s var(--ease) .3s}
  .env__letter::after{content:"";position:absolute;inset:11px;border-radius:4px;border:1px dashed rgba(255,158,196,.45)}
  .env__clip{position:absolute;inset:0;border-radius:16px;overflow:hidden;z-index:3}
  .env__pocket{position:absolute;inset:0;background:linear-gradient(158deg,#ffdcec 0%,#ffc2dc 62%,#ffb2d2 100%);
    clip-path:polygon(0 0,50% 46%,100% 0,100% 100%,0 100%)}
  .env__pocket::after{content:"";position:absolute;inset:0;
    background:linear-gradient(158deg,rgba(255,255,255,.7),rgba(255,255,255,0) 52%)}
  .stamp{position:absolute;right:6%;top:8%;width:19%;aspect-ratio:1/1.22;z-index:4;
    background:linear-gradient(150deg,#f3f0ff,#e5e0ff);border-radius:3px;
    box-shadow:0 4px 10px rgba(96,72,168,.18);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    outline:2px dashed rgba(255,255,255,.9);outline-offset:-5px}
  .stamp b{font-size:13px;color:#6a56c0;letter-spacing:.06em}
  .stamp i{font-style:normal;font-size:8px;letter-spacing:.16em;color:#a58ce8}

  .env__flap{position:absolute;left:0;right:0;top:0;height:62%;z-index:5;
    clip-path:polygon(0 0,100% 0,50% 100%);
    background:linear-gradient(172deg,#fffafd 0%,#ffeaf4 55%,#ffd7e8 100%);
    transform-origin:50% 0;transform-style:preserve-3d;backface-visibility:hidden;
    transition:transform .9s var(--ease);
    filter:drop-shadow(0 10px 12px rgba(146,74,116,.22))}
  .env__flap::after{content:"";position:absolute;inset:0;
    background:linear-gradient(172deg,rgba(255,255,255,.55),rgba(255,255,255,0) 60%)}
  .env.is-open .env__flap{transform:rotateX(-176deg)}
  .env.is-open .env__letter{transform:translateY(-26%)}

  /* 火漆 */
  .seal{position:absolute;left:50%;top:62%;width:74px;height:74px;transform:translate(-50%,-50%);
    z-index:7;border:0;background:none;padding:0;cursor:pointer}
  .seal svg{width:100%;height:100%;display:block;overflow:visible}
  .seal__glow{position:absolute;inset:-45%;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,158,196,.55) 0%,rgba(255,158,196,.18) 42%,rgba(255,158,196,0) 68%);
    animation:sealGlow 3.4s ease-in-out infinite}
  @keyframes sealGlow{0%,100%{opacity:.4;transform:scale(.94)}50%{opacity:1;transform:scale(1.1)}}
  .seal__half{position:absolute;inset:0;transition:transform .62s ease-out,opacity .62s ease-out}
  .seal__half.l{clip-path:inset(0 50% 0 0)}
  .seal__half.r{clip-path:inset(0 0 0 50%)}
  .seal__crack{position:absolute;left:50%;top:4%;width:2px;height:92%;transform:scaleY(0);opacity:0;
    background:linear-gradient(transparent,#fff8e8 16%,#ffffff 50%,#fff8e8 84%,transparent);filter:blur(.3px)}
  .env.is-crack .seal__crack{animation:crackFlash .52s ease-out}
  @keyframes crackFlash{0%{opacity:0;transform:scaleY(0)}22%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1)}}
  .env.is-open .seal__half.l{transform:translate(-34px,20px) rotate(-28deg);opacity:0}
  .env.is-open .seal__half.r{transform:translate(34px,22px) rotate(26deg);opacity:0}
  .env.is-open .seal__glow{animation:none;opacity:0;transition:opacity .4s}
  .seal__hint{position:absolute;left:50%;top:calc(100% + 14px);transform:translateX(-50%);white-space:nowrap;
    font-size:12px;letter-spacing:.32em;text-indent:.32em;color:var(--ink-soft);animation:hintFade 3.6s ease-in-out infinite}
  @keyframes hintFade{0%,100%{opacity:.45}50%{opacity:.95}}
  .env.is-open .seal__hint{opacity:0;transition:opacity .3s}

  /* 蹦出来的蛋 */
  .env-egg{position:absolute;left:50%;bottom:86%;width:min(24vw,88px);transform:translate(-50%,30px) scale(.4);
    opacity:0;z-index:6;pointer-events:none;filter:drop-shadow(0 10px 16px rgba(63,48,112,.28))}
  .env-egg.is-pop{animation:eggPop 1s var(--ease) forwards}
  @keyframes eggPop{
    0%{opacity:0;transform:translate(-50%,26px) scale(.4) rotate(-8deg)}
    30%{opacity:1;transform:translate(-50%,-26px) scale(1.1) rotate(7deg)}
    55%{transform:translate(-50%,-40px) scale(.96) rotate(-3deg)}
    78%{transform:translate(-50%,-33px) scale(1.03) rotate(1.5deg)}
    100%{opacity:1;transform:translate(-50%,-36px) scale(1) rotate(0)}
  }
  .egg__bob{transform-origin:50% 92%;display:block;width:100%;height:auto}
  .is-pop .egg__bob{animation:bob 3.2s ease-in-out 1s infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1.4deg)}50%{transform:translateY(-7px) rotate(1.4deg)}}
  .egg__eyes{transform-box:fill-box;transform-origin:50%;animation:blink 5.4s ease-in-out infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
  .egg__arm{transform-box:fill-box;transform-origin:50% 8%;animation:wave 3.6s ease-in-out infinite}
  @keyframes wave{0%,56%,100%{transform:rotate(0)}66%{transform:rotate(-24deg)}76%{transform:rotate(8deg)}86%{transform:rotate(-15deg)}}

  .btn-wrap{margin-top:clamp(14px,3.2vh,26px)}
  .gift-btn{position:relative;border:0;cursor:pointer;font-family:inherit;
    padding:15px 36px;border-radius:999px;font-size:15.5px;font-weight:700;letter-spacing:.14em;text-indent:.14em;color:#fff;
    background:linear-gradient(135deg,#8fcbf2 0%,#a58ce8 46%,#ff9ec4 100%);
    box-shadow:0 14px 30px rgba(111,87,196,.34), inset 0 1px 0 rgba(255,255,255,.6);
    transition:transform .22s var(--ease);overflow:hidden}
  .gift-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.55) 46%,transparent 62%);
    transform:translateX(-120%);animation:sheen 3.6s ease-in-out infinite}
  @keyframes sheen{0%,55%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}
  .gift-btn:active{transform:translateY(2px) scale(.98)}
  .hint{margin:12px 0 0;font-size:12px;letter-spacing:.16em;color:var(--ink-soft);opacity:.85}

  /* ---------- 信纸 ---------- */
  .peek{width:min(26vw,92px);margin:0 auto -14px;filter:drop-shadow(0 10px 16px rgba(63,48,112,.26));
    animation:bob 3.4s ease-in-out infinite .2s;position:relative;z-index:3}
  .peek svg{display:block;width:100%;height:auto}
  .letter-card{position:relative;width:min(92vw,410px);margin:0 auto;
    padding:clamp(20px,4.6vw,28px) clamp(18px,4.6vw,26px) 14px;border-radius:22px;text-align:center;
    background:linear-gradient(172deg,rgba(255,255,255,.98),rgba(255,249,252,.95));
    box-shadow:0 24px 50px rgba(96,72,168,.18), 0 0 0 1px rgba(255,255,255,.85) inset}
  .letter-card::before{content:"";position:absolute;inset:9px;border-radius:16px;
    border:1px dashed rgba(255,170,205,.5);pointer-events:none}
  .card__tag{margin:0 0 8px;font-size:10.5px;letter-spacing:.42em;text-indent:.42em;color:var(--pink);font-weight:700}
  .card__title{margin:0 0 12px;font-size:clamp(19px,5.4vw,23px);font-weight:800;letter-spacing:.04em;
    background:linear-gradient(100deg,#6a56c0,#c86fa8 58%,#e78fb8);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .card__line{margin:0 0 8px;font-size:clamp(13.5px,3.9vw,15px);line-height:1.88;color:var(--ink)}
  .card__line em{font-style:normal;color:var(--violet);font-weight:700}
  .card__sign{margin:13px 0 0;font-size:12px;letter-spacing:.1em;color:var(--ink-soft)}
  .card__tag,.card__title,.card__line,.card__sign{opacity:0;transform:translateY(14px);
    transition:opacity .6s var(--ease),transform .6s var(--ease)}
  .letter-card.is-in .card__tag,.letter-card.is-in .card__title,.letter-card.is-in .card__line,.letter-card.is-in .card__sign{opacity:1;transform:none}
  .card-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;padding-top:11px;
    border-top:1px dashed rgba(122,107,166,.24);flex-wrap:wrap}
  .mini{border:0;background:transparent;cursor:pointer;font-family:inherit;font-size:12.5px;letter-spacing:.08em;
    color:var(--ink-soft);padding:7px 8px;border-radius:999px;transition:color .2s,background .2s}
  .mini:active{transform:scale(.96)}
  .dot{width:3px;height:3px;border-radius:50%;background:rgba(122,107,166,.45)}
  .to-cake{margin-top:16px;border:0;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.14em;
    padding:13px 30px;border-radius:999px;color:#fff;
    background:linear-gradient(135deg,#8b78d6,#c98fd2 55%,#ff9ec4);
    box-shadow:0 12px 26px rgba(120,92,200,.32);transition:transform .2s var(--ease)}
  .to-cake:active{transform:scale(.97)}

  /* ---------- 星空蛋糕 ---------- */
  .night-inner{padding-top:2px}
  .night-eyebrow{margin:0 0 8px;font-size:10px;letter-spacing:.36em;text-indent:.36em;color:rgba(214,205,255,.75)}
  .night-title{margin:0;font-size:clamp(24px,7vw,32px);font-weight:800;letter-spacing:.06em;
    background:linear-gradient(100deg,#ffe2f0,#cfd4ff 50%,#a9d8ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 18px rgba(120,150,255,.35))}
  .night-sub{margin:6px 0 0;font-size:12px;letter-spacing:.22em;color:rgba(206,198,240,.7)}
  .cake-wrap{width:min(88vw,338px);margin:clamp(4px,1.4vh,12px) auto 0;position:relative}
  #cake{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 24px 34px rgba(0,0,0,.45))}
  .candle{cursor:pointer}
  .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 1.5s ease-in-out infinite}
  @keyframes flicker{0%,100%{transform:scale(1) translateY(0) rotate(-1deg);opacity:.95}35%{transform:scale(1.08,.94) translateY(-1px) rotate(2deg);opacity:1}70%{transform:scale(.94,1.06) translateY(1px) rotate(-2deg);opacity:.9}}
  .candle.is-out .flame{animation:none;opacity:0;transform:scale(.1);transition:opacity .3s ease,transform .3s ease}
  .smoke{opacity:0;transition:opacity .3s ease}
  .candle.is-out .smoke{opacity:.55}
  .candle.is-out .smoke path{animation:smokeRise 2.2s ease-out infinite}
  @keyframes smokeRise{0%{transform:translateY(0) scale(.7);opacity:.7}100%{transform:translateY(-24px) scale(1.5);opacity:0}}
  .cake-hint{margin:6px 0 0;font-size:12px;letter-spacing:.14em;color:rgba(214,205,255,.72);min-height:18px}
  .blow-btn{margin-top:10px;border:0;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.12em;
    padding:12px 26px;border-radius:999px;color:#2a1f4a;
    background:linear-gradient(135deg,#ffe1ef,#cdd4ff);
    box-shadow:0 10px 26px rgba(180,170,255,.32);transition:transform .2s var(--ease),opacity .3s ease}
  .blow-btn:active{transform:scale(.97)}
  .blow-btn.is-done{opacity:.35;pointer-events:none}
  .wish{margin:12px 0 0;font-size:13px;letter-spacing:.12em;line-height:1.8;color:#ffd9ea;
    opacity:0;transform:translateY(8px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
  .wish.is-in{opacity:1;transform:none}
  .night-mini{margin-top:14px;color:rgba(214,205,255,.6)}
  .night-mini:hover{color:#fff;background:rgba(255,255,255,.08)}

  .night-bokeh{position:absolute;border-radius:50%;pointer-events:none;filter:blur(1.5px);opacity:.5;mix-blend-mode:screen}
  .nb1{width:16px;height:16px;left:9%;top:24%;background:radial-gradient(circle,#ffd9ea,#ff9ec4 62%,transparent 72%);animation:floaty 9s ease-in-out infinite}
  .nb2{width:26px;height:26px;right:8%;top:18%;background:radial-gradient(circle,#d8ecff,#8ecbf5 62%,transparent 72%);animation:floaty 12s ease-in-out infinite 1.2s}
  .nb3{width:10px;height:10px;left:16%;top:62%;background:radial-gradient(circle,#efe6ff,#b8a6ff 62%,transparent 72%);animation:floaty 10s ease-in-out infinite .6s}
  .nb4{width:20px;height:20px;right:14%;top:58%;background:radial-gradient(circle,#ffe7d4,#ffb98a 62%,transparent 72%);animation:floaty 14s ease-in-out infinite 2s}
  .nb5{width:12px;height:12px;left:44%;top:12%;background:radial-gradient(circle,#ffffff,#cfe4ff 62%,transparent 72%);animation:floaty 11s ease-in-out infinite 1.6s}
  .shoot{position:absolute;width:110px;height:1.5px;border-radius:2px;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.9));opacity:0;transform:rotate(24deg)}
  .shoot.s1{left:6%;top:18%;animation:shoot 7s ease-in infinite 1.5s}
  .shoot.s2{right:10%;top:34%;animation:shoot 9s ease-in infinite 4s}
  @keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(24deg) scaleX(.2)}
    12%{opacity:.5;transform:translate(60px,26px) rotate(24deg) scaleX(1)}
    30%{opacity:0;transform:translate(160px,70px) rotate(24deg) scaleX(1)}
    100%{opacity:0}}

  @media (prefers-reduced-motion:reduce){
    .aurora,.bokeh,.stars,.flame,.seal__glow,.seal__hint,.egg__eyes,.egg__arm,.is-pop .egg__bob,.peek,.gift-btn::before,.shoot{animation:none!important}
    .layer{transition-duration:.01s}
    .candle.is-out .smoke path{animation:none}
  }
  @media (max-height:720px){
    .hint{display:none}
    .env-wrap{width:min(70vw,300px)}
    .sub{margin-top:8px}
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div>
  <div class="bokeh b1"></div><div class="bokeh b2"></div><div class="bokeh b3"></div><div class="bokeh b4"></div>
  <div class="stars"></div>
</div>
<canvas class="fx" id="fx" aria-hidden="true"></canvas>
<canvas class="fx" id="fxTop" aria-hidden="true"></canvas>

<template id="eggTpl">
  <svg viewBox="0 0 200 236" role="img" aria-label="蛋小黑">
    <g class="egg__bob">
      <defs>
        <radialGradient id="eggBody" cx="36%" cy="24%" r="84%">
          <stop offset="0" stop-color="#7a7a96"/><stop offset="38%" stop-color="#3d3d56"/><stop offset="100%" stop-color="#1b1b28"/>
        </radialGradient>
        <linearGradient id="hatG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffd7e7"/><stop offset="1" stop-color="#ff9ec4"/>
        </linearGradient>
        <radialGradient id="eggShine" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <ellipse cx="100" cy="222" rx="46" ry="8" fill="#5b46a8" opacity=".14"/>

  }
  function bell(a, dest, freq, at) {
    var o = a.createOscillator(), o2 = a.createOscillator(), g = a.createGain();
    o.type = "sine"; o2.type = "sine";
    o.frequency.value = freq; o2.frequency.value = freq * 2.001;
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(.075, at + .02);
    g.gain.exponentialRampToValueAtTime(.0006, at + 2.1);
    o.connect(g); o2.connect(g); g.connect(dest);
    o.start(at); o2.start(at); o.stop(at + 2.2); o2.stop(at + 2.2);
  }
  var CHORDS = [[110.00, 138.59, 164.81], [82.41, 123.47, 164.81], [92.50, 110.00, 138.59], [73.42, 110.00, 146.83]];
  var BELLS = [880.00, 987.77, 1108.73, 1318.51, 1479.98];
  function musicTick() {
    if (!music) return;
    var a = music.a, now = a.currentTime;
    while (music.chordAt < now + 2.4) {
      var ch = CHORDS[music.i % CHORDS.length];
      music.i++;
      for (var c = 0; c < ch.length; c++) pad(a, music.master, ch[c], music.chordAt, 5.4);
      music.chordAt += 4.8;
    }
    while (music.bellAt < now + 2.4) {
      if (Math.random() < .78) bell(a, music.master, BELLS[(Math.random() * BELLS.length) | 0], music.bellAt);
      music.bellAt += 1.3 + Math.random() * 1.7;
    }
  }
  function startMusic() {
    if (music || !soundOn) return;
    var a = ac(); if (!a) return;
    var master = a.createGain(); master.gain.value = 0;
    var dry = a.createGain(); dry.gain.value = .5;
    var wet = a.createGain(); wet.gain.value = .45;
    var conv = a.createConvolver(); conv.buffer = impulse(a, 3.2, 2.6);
    master.connect(dry); dry.connect(a.destination);
    master.connect(conv); conv.connect(wet); wet.connect(a.destination);
    master.gain.linearRampToValueAtTime(.85, a.currentTime + 3);
    music = { a: a, master: master, chordAt: a.currentTime + .3, bellAt: a.currentTime + 1.8, i: 0, timer: setInterval(musicTick, 700) };
    musicTick();
  }
  function stopMusic() {
    if (!music) return;
    var m = music; music = null;
    clearInterval(m.timer);
    try {
      m.master.gain.cancelScheduledValues(m.a.currentTime);
      m.master.gain.setValueAtTime(m.master.gain.value, m.a.currentTime);
      m.master.gain.linearRampToValueAtTime(0, m.a.currentTime + .8);
    } catch (e) {}
    setTimeout(function () { try { m.master.disconnect(); } catch (e) {} }, 1200);
  }
  function chime() {
    if (!soundOn) return;
    var a = ac(); if (!a) return;
    var now = a.currentTime;
    [659.25, 783.99, 987.77, 1318.51].forEach(function (f, i) {
      var o = a.createOscillator(), g = a.createGain();
      o.type = "sine"; o.frequency.value = f;
      var st = now + i * .12;
      g.gain.setValueAtTime(0, st);
      g.gain.linearRampToValueAtTime(.14, st + .02);
      g.gain.exponentialRampToValueAtTime(.0008, st + 1.1);
      o.connect(g).connect(a.destination); o.start(st); o.stop(st + 1.2);
    });
  }
  function whoosh() {
    if (!soundOn) return;
    var a = ac(); if (!a) return;
    var dur = .75, sr = a.sampleRate, buf = a.createBuffer(1, Math.floor(sr * dur), sr), d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) { var e = 1 - i / d.length; d[i] = (Math.random() * 2 - 1) * e * e * .6; }
    var src = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = 950; f.Q.value = .6;
    g.gain.value = .3;
    src.connect(f); f.connect(g); g.connect(a.destination); src.start();
  }

  /* ================= 蛋小黑 ================= */
  function makeEgg(host, cls) {
    var clone = $("eggTpl").content.cloneNode(true);
    var svg = clone.querySelector("svg");
    svg.querySelectorAll("[id]").forEach(function (el) { el.id = cls + "-" + el.id; });
    svg.querySelectorAll("*").forEach(function (el) {
      for (var i = 0; i < el.attributes.length; i++) {
        var at = el.attributes[i];
        if (at.value.indexOf("url(#") >= 0) at.value = at.value.replace(/url\(#/g, "url(#" + cls + "-");
      }
    });
    host.appendChild(clone);
    var made = host.querySelector("svg");
    made.classList.add(cls);
    return made;
  }

  /* ================= 蛋糕星屑 ================= */
  var NS = "http://www.w3.org/2000/svg";
  var SPECK_BOX = {
    "1": [34, 306, 306, 382, 56],
    "2": [72, 242, 268, 306, 30],
    "3": [104, 180, 236, 238, 18]
  };
  function buildSpeckles() {
    document.querySelectorAll(".speckles").forEach(function (g) {
      var b = SPECK_BOX[g.getAttribute("data-clip")];
      if (!b) return;
      for (var i = 0; i < b[4]; i++) {
        var c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", rand(b[0], b[2]).toFixed(1));
        c.setAttribute("cy", rand(b[1], b[3]).toFixed(1));
        c.setAttribute("r", rand(.4, 1.4).toFixed(2));
        c.setAttribute("fill", "#ffffff");
        c.setAttribute("opacity", rand(.25, .95).toFixed(2));
        g.appendChild(c);
      }
    });
  }

  /* ================= 十八根蜡烛 ================= */
  var candleEls = [];
  function buildCandles() {
    var layer = $("candleLayer");
    var CX = 170, CY = 180, RX = 58, RY = 10, N = 18;
    var items = [];
    for (var i = 0; i < N; i++) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / N;
      items.push({ x: CX + RX * Math.cos(a), y: CY + RY * Math.sin(a), h: 26 + (i % 3) * 2 });
    }
    items.sort(function (p, q) { return p.y - q.y; });
    items.forEach(function (it) {
      var x = it.x, y = it.y, hh = it.h, tip = y - hh;
      var g = document.createElementNS(NS, "g");
      g.setAttribute("class", "candle");
      g.innerHTML =
        '<rect x="' + (x - 2.5).toFixed(1) + '" y="' + tip.toFixed(1) + '" width="5" height="' + hh + '" rx="2.5" fill="#fffaf2"/>' +
        '<rect x="' + (x - 2.5).toFixed(1) + '" y="' + tip.toFixed(1) + '" width="2" height="' + hh + '" rx="1" fill="#ffe1ee" opacity=".9"/>' +
        '<line x1="' + x.toFixed(1) + '" y1="' + tip.toFixed(1) + '" x2="' + x.toFixed(1) + '" y2="' + (tip - 3.5).toFixed(1) + '" stroke="#6b5a4a" stroke-width="1.4"/>' +
        '<g class="smoke"><path d="M' + x.toFixed(1) + ' ' + (tip - 7).toFixed(1) + ' q-4 -7 0 -14 q4 -7 0 -14" fill="none" stroke="#cfc7e3" stroke-width="1.8" stroke-linecap="round"/></g>' +
        '<g class="flame">' +
          '<ellipse cx="' + x.toFixed(1) + '" cy="' + (tip - 13).toFixed(1) + '" rx="6.4" ry="7.8" fill="url(#flameGlow2)"/>' +
          '<path d="M' + x.toFixed(1) + ' ' + (tip - 22).toFixed(1) + 'c4.2 3.6 5.6 6.4 5.6 9.2 0 4.2-2.5 6.6-5.6 6.6s-5.6-2.4-5.6-6.6c0-2.8 1.4-5.6 5.6-9.2Z" fill="url(#flameG2)"/>' +
        '</g>';
      layer.appendChild(g);
      candleEls.push(g);
    });
  }

  /* ================= 场景 ================= */
  var cover = $("cover"), letter = $("letter"), cakeScene = $("cakeScene");
  var env = $("env"), envEgg = $("envEgg"), letterCard = $("letterCard");
  var opened = false, busy = false, blown = false, current = "cover";
  makeEgg(envEgg, "egg");
  makeEgg($("peek"), "peek-art");

  var SCENES = { cover: cover, letter: letter, cake: cakeScene };
  function show(name) {
    current = name;
    for (var k in SCENES) SCENES[k].classList.toggle("is-visible", k === name);
  }
  function go(name, wait) {
    current = name;
    for (var k in SCENES) SCENES[k].classList.remove("is-visible");
    setTimeout(function () { SCENES[name].classList.add("is-visible"); }, wait || 320);
  }
  function staggerCard() {
    var bits = letterCard.querySelectorAll(".card__tag,.card__title,.card__line,.card__sign");
    for (var b = 0; b < bits.length; b++) bits[b].style.transitionDelay = (0.05 + b * 0.11) + "s";
  }

  function openEnvelope() {
    if (opened || busy) return;
    opened = true; busy = true;
    startMusic();
    var seal = $("seal");
    burstAt(seal, reduce ? 12 : 26);
    env.classList.add("is-crack");
    setTimeout(function () {
      env.classList.add("is-open");
      burstAt(seal, reduce ? 10 : 32);
    }, reduce ? 60 : 300);
    setTimeout(function () {
      $("envEgg").classList.add("is-pop");
      chime();
      burstAt(envEgg, reduce ? 14 : 46);
    }, reduce ? 380 : 900);
    setTimeout(function () {
      go("letter", reduce ? 40 : 420);
      staggerCard();
      setTimeout(function () {
        letterCard.classList.add("is-in");
        busy = false;
      }, reduce ? 60 : 460);
      setTimeout(function () { burstAt($("peek"), reduce ? 12 : 36); }, reduce ? 500 : 1100);
    }, reduce ? 760 : 1500);
  }

  function blow() {
    if (blown || current !== "cake") return;
    blown = true;
    whoosh();
    $("blowBtn").classList.add("is-done");
    candleEls.forEach(function (c, i) {
      setTimeout(function () { c.classList.add("is-out"); }, i * 75);
    });
    setTimeout(function () {
      $("wish").classList.add("is-in");
      $("cakeHint").textContent = "十八岁，愿望会实现的";
      var r = $("cake").getBoundingClientRect();
      confetti(r.left + r.width / 2, r.top + r.height * .18, reduce ? 16 : 80);
      setTimeout(function () {
        confetti(r.left + r.width * .2, r.top + r.height * .26, reduce ? 10 : 34);
        confetti(r.left + r.width * .8, r.top + r.height * .24, reduce ? 10 : 34);
      }, 260);
      chime();
    }, 320 + candleEls.length * 75);
  }

  function resetAll() {
    opened = false; busy = false; blown = false;
    env.classList.remove("is-open", "is-crack");
    $("envEgg").classList.remove("is-pop");
    letterCard.classList.remove("is-in");
    $("blowBtn").classList.remove("is-done");
    $("wish").classList.remove("is-in");
    $("cakeHint").textContent = "十八根蜡烛，替她吹一下吧";
    candleEls.forEach(function (c) { c.classList.remove("is-out"); });
    cakeScene.scrollTop = 0; letter.scrollTop = 0;
    go("cover", 60);
  }

  $("seal").addEventListener("click", openEnvelope);
  $("openBtn").addEventListener("click", openEnvelope);
  $("toCake").addEventListener("click", function () {
    go("cake", reduce ? 40 : 360);
    var c = $("cake");
    setTimeout(function () {
      var r = c.getBoundingClientRect();
      confetti(r.left + r.width / 2, r.top + r.height * .2, reduce ? 10 : 36);
    }, 260);
  });
  $("backLetter").addEventListener("click", function () { go("letter", reduce ? 40 : 320); });
  $("blowBtn").addEventListener("click", blow);
  $("cake").addEventListener("click", blow);

  $("replay").addEventListener("click", function () {
    if (busy) return;
    busy = true;
    resetAll();
    setTimeout(function () { busy = false; }, 400);
  });
  $("soundBtn").addEventListener("click", function () {
    soundOn = !soundOn;
    this.textContent = soundOn ? "音乐：开" : "音乐：关";
    this.setAttribute("aria-pressed", soundOn ? "true" : "false");
    if (soundOn) { startMusic(); chime(); } else { stopMusic(); }
  });

  var rzT = 0;
  window.addEventListener("resize", function () {
    clearTimeout(rzT);
    rzT = setTimeout(function () {
      resize();
      petals.forEach(function (p) {
        if (p.x > W + 60 || p.y > H + 60) { p.x = rand(0, W); p.y = rand(-40, 0); }
      });
    }, 160);
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopLoop(); else startLoop();
  });

  show("cover");
  buildSpeckles();
  buildCandles();
  seed();
  startLoop();
})();
</script>
</body>
</html>
